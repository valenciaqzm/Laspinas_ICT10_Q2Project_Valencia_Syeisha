                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-1">Candidate Verification</h3>
                        <p class="text-center text-muted mb-4">Enter your name to check if you made it.</p>

                        <div class="mb-3">
                            <label for="first-name" class="form-label">First Name</label>

                        <div class="mb-3">

                        <button class="btn btn-pink w-100" py-click="check_name">Check</button>
